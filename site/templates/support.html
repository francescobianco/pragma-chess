<section class="support" id="support">
  <h2>{{support.title}}</h2>
  <p class="section-lead">{{support.lead}}</p>
  <div class="grid">
    {{#each support.items}}<article class="card">
      <h3>{{title}}</h3>
      <p>{{text}}</p>
      {{#if link}}<a href="{{link}}" rel="noopener">{{link_text}}</a>{{/if}}
    </article>
    {{/each}}
  </div>
</section>
