<section class="hero" id="top">
  <div class="hero-text">
    <h1>{{hero.title}}</h1>
    <p class="lead">{{hero.lead}}</p>
    <p class="actions">
      <a class="button primary" href="#download">{{hero.download}}</a>
      <a class="button" href="{{repo_url}}" rel="noopener">{{hero.source}}</a>
    </p>
    <p class="hero-note">{{hero.note}}</p>
  </div>
  <figure class="hero-shot">
    <img src="../assets/screenshots/hero.png" alt="{{hero.alt}}" loading="eager" width="1600" height="973">
  </figure>
</section>
