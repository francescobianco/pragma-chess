# Builds the installers of Pragma Chess and publishes them as a GitHub release.
#
# - Push a tag vX.Y.Z: builds everything and publishes release vX.Y.Z.
# - Run it by hand (Actions ▸ Release ▸ Run workflow): builds everything and
#   keeps the installers as workflow artifacts, without releasing.
#
# The build steps themselves live in packaging/ and run the same on a laptop.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF#refs/tags/v}
            echo "version=${version%%-*}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  deb:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build \
            qt6-base-dev qt6-svg-dev libqt6sql6-sqlite qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools qt6-translations-l10n libssl-dev pkg-config git dpkg-dev file make patch
      - name: Build the .deb
        run: packaging/linux/build-packages.sh deb "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    needs: version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Dependencies
        run: |
          dnf install -y git cmake ninja-build gcc-c++ make patch rpm-build \
            qt6-qtbase-devel qt6-qtsvg-devel qt6-qttools-devel openssl-devel curl tar
      - uses: actions/checkout@v4
      - name: Build the .rpm
        run: packaging/linux/build-packages.sh rpm "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: error

  # Stockfish for Windows, built on Linux with MinGW (the Windows machine has
  # no make nor g++); the other platforms build theirs in their own job.
  engine-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: MinGW
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix make patch
      - name: Build Stockfish
        run: scripts/build-stockfish.sh engine windows-x86-64
      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: engine/
          if-no-files-found: error

  windows:
    needs: [version, engine-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-windows
          path: engine-windows
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build the installer
        shell: pwsh
        run: packaging\windows\build.ps1 -Version "${{ needs.version.outputs.version }}" -Engine "$env:GITHUB_WORKSPACE\engine-windows"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-14
    env:
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: create-dmg
        run: brew install create-dmg
      - name: Signing certificate
        if: env.MACOS_SIGN_IDENTITY != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Build the disk image
        run: packaging/macos/build.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, deb, rpm, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # The packages only: engine-windows is already inside the Windows ones.
          pattern: "{linux-deb,linux-rpm,windows,macos}"
          merge-multiple: true
      - name: Stockfish source, shipped with the installers (GPL v3)
        run: scripts/build-stockfish.sh --source dist
      - name: Names without the version, for the releases/latest/download links
        run: packaging/latest-names.sh dist
      - name: The version the clients check for (Help ▸ Check for Updates)
        run: |
          printf '{"version": "%s", "url": "https://github.com/%s/releases/tag/%s"}\n' \
            "${{ needs.version.outputs.version }}" "${{ github.repository }}" "${{ github.ref_name }}" > dist/version.json
          cat dist/version.json
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -lS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # What is new comes from this version's section of CHANGELOG.md.
          awk -v version="${{ needs.version.outputs.version }}" '
            /^## \[/ { on = index($0, "## [" version "]") == 1; next }
            /^\[[^]]+\]: / { on = 0 }
            on' CHANGELOG.md > changes.md
          if grep -q '[^[:space:]]' changes.md; then
            { echo "## What's new"; cat changes.md; } > notes.md
          fi
          sed "s/@VERSION@/${{ needs.version.outputs.version }}/g" packaging/release-notes.md >> notes.md
          prerelease=
          [[ "$TAG" == *-* ]] && prerelease=--prerelease
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Pragma Chess ${TAG#v}" \
              --notes-file notes.md --generate-notes $prerelease --verify-tag
          fi

  # The release told in the Discussions' Announcements, from this version's
  # section of CHANGELOG.md: people who follow the repository's discussions
  # hear of it there (DISTRIBUTING.md, "Release day").
  announce:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@v4
      - name: Post in Announcements
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          awk -v version="$VERSION" '
            /^## \[/ { on = index($0, "## [" version "]") == 1; next }
            /^\[[^]]+\]: / { on = 0 }
            on' CHANGELOG.md > changes.md
          {
            echo "Pragma Chess $VERSION is out. Download it from the site, https://yafb.net/pragma-chess/, or from the [release page](https://github.com/$REPO/releases/tag/v$VERSION); copies already installed say so in Help ▸ Check for Updates."
            echo
            echo "## What's new"
            cat changes.md
            echo
            echo "Something broken, or an explanation that is wrong? [Open an issue](https://github.com/$REPO/issues/new/choose). Questions and ideas: here in the Discussions."
          } > body.md
          owner="${REPO%/*}" name="${REPO#*/}"
          ids=$(gh api graphql -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id discussionCategories(first:20){nodes{id name}}}}' \
            -f owner="$owner" -f name="$name" \
            -q '.data.repository.id + " " + (.data.repository.discussionCategories.nodes[] | select(.name == "Announcements") | .id)')
          read -r repo_id category_id <<< "$ids"
          gh api graphql -f query='mutation($repo:ID!,$category:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repo,categoryId:$category,title:$title,body:$body}){discussion{url}}}' \
            -f repo="$repo_id" -f category="$category_id" -f title="Pragma Chess $VERSION" -F body=@body.md \
            -q .data.createDiscussion.discussion.url

  # A pull request to winget-pkgs with the new version (DISTRIBUTING.md,
  # winget). It needs a classic token with public_repo, as the secret
  # WINGET_TOKEN, and the package already in winget-pkgs; until both, it
  # says so and the release is not affected.
  winget:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [version, release]
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Is there a token?
        id: token
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No WINGET_TOKEN secret: send the winget update by hand (packaging/winget/make-winget.sh)"; fi
      - if: steps.token.outputs.present == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: FrancescoBianco.PragmaChess
          version: ${{ needs.version.outputs.version }}
          installers-regex: '-[0-9.]+-windows-x64-setup\.exe$'  # the versioned name, not the latest one
          token: ${{ secrets.WINGET_TOKEN }}
