name: Distribution

# Every Monday: where Pragma Chess stands (scripts/distribution-status.sh) in
# the run's summary, and the day's numbers appended to distribution.csv in
# the private repository francescobianco/pragma-chess-stats — GitHub keeps
# visits and clones 14 days only, and shows them to the owner only, so they
# are kept apart from this public repository and its history.
# The secret DISTRIBUTION_TOKEN reads this repository's traffic and writes
# the stats repository (a fine-grained token: Administration read on
# pragma-chess, Contents read and write on pragma-chess-stats).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The numbers kept so far
        uses: actions/checkout@v4
        with:
          repository: francescobianco/pragma-chess-stats
          token: ${{ secrets.DISTRIBUTION_TOKEN }}
          path: stats
      - name: Where we stand
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN || github.token }}
        run: scripts/distribution-status.sh --csv stats/distribution.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the numbers
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution.csv
          git commit -qm "Distribution, $(date -u +%F)" && git push -q
