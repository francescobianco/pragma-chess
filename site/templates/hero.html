<section class="hero" id="top">
  <div class="hero-text">
    <h1>{{hero.title}}</h1>
    <p class="lead">{{hero.lead}}</p>
    <p class="actions">
      <a class="button primary" href="#download">{{hero.download}}</a>
      <a class="button" href="{{repo_url}}" rel="noopener">{{hero.source}}</a>
    </p>
    <p class="hero-note">{{hero.note}}</p>
  </div>
  <figure class="hero-shot">
    <video src="../assets/pragma-chess-explain.webm" poster="../assets/screenshots/hero.png" width="1280" height="768"
           autoplay muted loop playsinline preload="metadata" aria-label="{{hero.video_alt}}"></video>
    <figcaption>{{hero.video_caption}}</figcaption>
  </figure>
</section>
