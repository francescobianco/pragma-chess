name: Translation
description: Translate Pragma Chess into your language, or fix a translation.
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! How to translate is in
        [CONTRIBUTING.md](https://github.com/francescobianco/pragma-chess/blob/main/CONTRIBUTING.md#translating):
        no code, a file for the interface and one for the guide. Opening this
        issue first tells others the language is taken.
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "Deutsch (de)"
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: What
      multiple: true
      options:
        - The interface
        - The guide
        - The web site
        - A fix to an existing translation
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything we should know; attach the files here if you do not use Git.
